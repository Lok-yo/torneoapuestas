schema: spec-driven

project: gg2
execution_mode: auto
artifact_store:
  mode: engram
delivery_strategy: auto-chain
review_budget_lines: 20000
strict_tdd: true

context: |
  Stack: React 19 SPA using Vite 8, JavaScript/JSX, React Router 7, Zustand 5, Recharts, and Tailwind CSS 4.
  Architecture: Route-based page components under src/pages, shared UI under src/components, layouts, static data, and persisted Zustand stores.
  Conventions: ES modules, function components, named stores, feature-oriented folders, and existing Spanish product copy.
  Testing: Vitest unit/integration suite under src (jsdom); Deno tests for supabase/functions edge functions; Playwright owns e2e/.

testing:
  strict_tdd: true
  runner:
    available: true
    command: npm run test
    framework: vitest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: npm run test -- --coverage
  quality:
    linter:
      available: true
      command: npm run lint
      tool: oxlint
    type_checker:
      available: false
      command: null
    formatter:
      available: false
      command: null
  build_command: npm run build

rules:
  proposal:
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group tasks by phase with hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    guidelines:
      - Follow existing React, Zustand, and folder conventions.
    tdd: true
    test_command: npm run test
  verify:
    test_command: npm run test
    build_command: npm run build
    lint_command: npm run lint
    coverage_threshold: 60
  archive:
    - Warn before merging destructive deltas.